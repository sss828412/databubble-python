name: CI

# The 54 tests in tests/ only ever ran if a human remembered check_local.sh.
# This runs them on every push and PR, on the oldest and newest supported
# Python, plus the SDK-vs-API drift check against the committed manifest.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q --ignore=tests/test_smoke_live.py

      - name: Check SDK/API drift
        run: python scripts/check_drift.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
